name: VS Code Extension CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install deps
        run: |
          cd vscode
          npm ci
      - name: Compile
        run: |
          cd vscode
          npm run compile
      - name: Verify output
        run: |
          cd vscode
          npm run check:out
